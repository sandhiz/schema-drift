version: 2

project_name: schema-drift

before:
  hooks:
    - go mod tidy

builds:
  - id: schema-drift
    main: ./cmd/schema-drift
    binary: schema-drift
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X schema-drift/internal/cli.Version={{.Version}}
      - -X schema-drift/internal/cli.Commit={{.ShortCommit}}
      - -X schema-drift/internal/cli.Date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
