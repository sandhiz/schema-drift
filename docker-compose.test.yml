services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: drift
      POSTGRES_PASSWORD: drift_password
      POSTGRES_DB: app_target
    ports:
      - "15432:5432"
    volumes:
      - ./testdata/docker/postgres_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drift -d app_target"]
      interval: 5s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: app_mysql
      MYSQL_USER: drift
      MYSQL_PASSWORD: drift_password
    ports:
      - "13306:3306"
    volumes:
      - ./testdata/docker/mysql_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-udrift", "-pdrift_password"]
      interval: 5s
      timeout: 5s
      retries: 15

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Drift_Password123!"
    ports:
      - "11433:1433"
    healthcheck:
      test: ["/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "Drift_Password123!", "-C", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 15
